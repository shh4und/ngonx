<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NGonx — Server Running</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #e0e0e0;
      padding: 1rem;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 2rem;
      padding: 3rem 4rem;
      max-width: 640px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-12px); }
    }

    .logo {
      font-size: 3.5rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #f7971e, #ffd200);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.5rem;
    }

    .logo small {
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.4em;
      display: block;
      color: rgba(255, 255, 255, 0.4);
      background: none;
      -webkit-background-clip: unset;
      background-clip: unset;
      margin-top: 0.25rem;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin: 1.5rem 0 2rem;
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .status .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse-dot 1.8s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.4; transform: scale(0.75); }
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin: 2rem 0;
    }

    .info-item {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 1rem;
      padding: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .info-item .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(255, 255, 255, 0.35);
      margin-bottom: 0.35rem;
    }

    .info-item .value {
      font-size: 0.95rem;
      font-weight: 600;
      color: #f0f0f0;
    }

    .info-item .value code {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.85rem;
      background: rgba(255, 255, 255, 0.06);
      padding: 0.15rem 0.5rem;
      border-radius: 0.4rem;
    }

    .quote {
      margin: 2rem 0 0;
      padding: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-style: italic;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.45);
      line-height: 1.6;
    }

    .quote a {
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      border-bottom: 1px dotted rgba(255, 255, 255, 0.2);
    }

    .quote a:hover {
      color: #f7971e;
      border-bottom-color: #f7971e;
    }

    @media (max-width: 480px) {
      .card { padding: 2rem 1.5rem; }
      .logo { font-size: 2.5rem; }
      .info-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      NGonx
      <small>from scratch</small>
    </div>

    <div class="status">
      <span class="dot"></span>
      Server Running
    </div>

    <div class="info-grid">
      <div class="info-item">
        <div class="label">Server</div>
        <div class="value"><code>NGonx/0.1</code></div>
      </div>
      <div class="info-item">
        <div class="label">Port</div>
        <div class="value"><code>4002</code></div>
      </div>
      <div class="info-item">
        <div class="label">HTTP</div>
        <div class="value"><code>1.1</code></div>
      </div>
      <div class="info-item">
        <div class="label">Concurrency</div>
        <div class="value">goroutines</div>
      </div>
    </div>

    <div class="quote">
      "Do you have what it takes to be an engineer at TheStartup™?<br>
      Can you say <em>synergy</em> and <em>democratize</em> with a straight face?"<br>
      <a href="https://www.boot.dev/" target="_blank" rel="noopener">— boot.dev</a>
    </div>
  </div>
</body>
</html>
